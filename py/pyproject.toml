[project]
name = "hayabusa-py"
version = "0.1.0"
description = "Python + PowerShell re-creation of Hayabusa's EVTX detection engine (no Rust in the product)."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
authors = [{ name = "Jose Pagan Torres" }]
dependencies = [
    "pyyaml>=6.0.3",
    "pywin32>=312; sys_platform == 'win32'",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[project.scripts]
hayabusa-py = "hayabusa_py.cli:main"
hayabusa-py-worker = "service.worker:main"
hayabusa-py-web = "service.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.14",
    "pip-audit>=2.10",
    "httpx>=0.28",  # FastAPI's TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hayabusa_py", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
