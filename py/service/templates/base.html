<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hayabusa timeline service{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root { color-scheme: light dark; --line: #8883; --muted: #7a7a7a; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 0 16px 48px; }
  main { max-width: 60rem; margin: 0 auto; }
  header { border-bottom: 1px solid var(--line); margin-bottom: 24px; padding: 20px 0 12px; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 28px 0 8px; }
  a { color: inherit; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: right; }
  .muted { color: var(--muted); }
  .state { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 0.85em; }
  .state.done { border-color: #2a7; } .state.failed { border-color: #c44; }
  .state.running { border-color: #48d; } .state.queued { border-color: var(--muted); }
  form.upload { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 8px 0 24px; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; }
  input[type=text] { padding: 6px; width: 18rem; max-width: 100%; }
  button { padding: 8px 16px; margin-top: 12px; font: inherit; }
  code { background: #8881; padding: 1px 4px; border-radius: 3px; }
  .err { border-left: 3px solid #c44; padding: 8px 12px; background: #c441; }
</style>
</head>
<body>
<header><main><h1><a href="/" style="text-decoration:none">Hayabusa timeline service</a></h1></main></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
